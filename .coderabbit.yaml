# CodeRabbit Configuration
# Правила для повышения качества AI code review

language: ru

reviews:
  # Профиль ревью: тщательный
  profile: assertive
  
  # Запрашивать изменения при критических проблемах
  request_changes_workflow: true
  
  # Высокий уровень детализации
  high_level_summary: true
  
  # Учитывать связанный код за пределами diff
  auto_review:
    enabled: true

  path_instructions:
    - path: "src/**/*.py"
      instructions: |
        При ревью Python-файлов обязательно проверяй:
        1. Совместимость форматов данных между функциями: если одна функция записывает данные в определённом формате (например, формат хранения пароля, формат даты), убедись что ВСЕ функции, которые читают эти данные, используют тот же формат. Проверь split/join/parse операции.
        2. При переходе с hard delete на soft delete: проверь ВСЕ функции, которые читают данные из той же таблицы — фильтруют ли они deleted_at. Проверь каскадные эффекты на связанные таблицы (comments, attachments).
        3. При изменении allowed-полей в update-функциях: проверь все вызовы этой функции — не передают ли они поля, которые будут молча проигнорированы.
        4. Если функция вызывает другую функцию с параметрами — проверь совместимость форматов параметров (например, формат даты DD.MM.YYYY vs YYYY-MM-DD).
        5. Проверяй функции аутентификации особенно тщательно: формат хранения, формат чтения, обратная совместимость.

    - path: "src/task_manager.py"
      instructions: |
        Этот файл содержит критическую бизнес-логику: аутентификацию, управление задачами, отчёты.
        ОБЯЗАТЕЛЬНО проверь:
        - Функции create_user и authenticate должны использовать ОДИНАКОВЫЙ формат хранения/чтения password_hash. Если формат в create_user изменился — authenticate тоже должна быть обновлена.
        - Все SQL-запросы к таблице tasks должны учитывать поле deleted_at, если оно добавлено в схему.
        - Функции, вызывающие update_task, должны передавать только поля из allowed set.
